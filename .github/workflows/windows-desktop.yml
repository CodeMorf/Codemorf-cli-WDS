name: Windows Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Web build
        run: npm run build
      - name: Rust check
        id: rustcheck
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath cargo-check.log
          if ($LASTEXITCODE -ne 0) {
            "failed=true" >> $env:GITHUB_OUTPUT
          } else {
            "failed=false" >> $env:GITHUB_OUTPUT
          }
      - name: Upload Rust diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-check-log
          path: cargo-check.log
          if-no-files-found: error
      - name: Stop if Rust check failed
        if: steps.rustcheck.outputs.failed == 'true'
        shell: pwsh
        run: exit 1
      - name: Build Windows installers
        run: npm run desktop:build
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: CodeMorf-CLI-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
